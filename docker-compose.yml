services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
      POSTGRES_DB: laundry
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
